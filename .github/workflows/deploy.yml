name: MathScore CI & Auto-Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mathscore-frontend/package-lock.json

      - name: Install dependencies (mathscore-frontend)
        working-directory: ./mathscore-frontend
        run: npm ci || npm install

      - name: Build frontend
        working-directory: ./mathscore-frontend
        run: npm run build
